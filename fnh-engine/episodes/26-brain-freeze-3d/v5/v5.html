<!doctype html><html><head><meta charset="utf-8">

</style></head><body>
<svg id="sv" width="1080" height="1920" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
  <pattern id="gmin" width="27" height="27" patternUnits="userSpaceOnUse"><path d="M27 0H0V27" fill="none" stroke="#dfe9f7" stroke-width="1.3"/></pattern>
  <pattern id="gmaj" width="135" height="135" patternUnits="userSpaceOnUse"><rect width="135" height="135" fill="url(#gmin)"/><path d="M135 0H0V135" fill="none" stroke="#c4d6f0" stroke-width="2.2"/></pattern>
  <pattern id="hCold" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="16" stroke="#19a7d8" stroke-width="5"/></pattern>
  <pattern id="hRed" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="14" stroke="#e63946" stroke-width="5"/></pattern>
  <pattern id="hWarm" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="16" stroke="#f4a12a" stroke-width="5"/></pattern>
  <pattern id="waffle" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="22" height="22" fill="#f6c983"/><path d="M0 0H22M0 0V22" stroke="#c7832e" stroke-width="4"/></pattern>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.022" numOctaves="2" seed="5" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="4"/></filter>
  <radialGradient id="bgCold" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#1b6fa8"/><stop offset="1" stop-color="#071a33"/></radialGradient>
  <radialGradient id="bgWarm" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#ffb347"/><stop offset="1" stop-color="#c2410c"/></radialGradient>
  <radialGradient id="bgPink" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#ff8fc4"/><stop offset="1" stop-color="#7b1fa2"/></radialGradient>
  <radialGradient id="bgBrain" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#5b3cc4"/><stop offset="1" stop-color="#140a3a"/></radialGradient>
  <radialGradient id="bgRed" cx="50%" cy="38%" r="80%"><stop offset="0" stop-color="#ff4d4d"/><stop offset="1" stop-color="#5a0010"/></radialGradient>
  <radialGradient id="bgSky" cx="50%" cy="35%" r="85%"><stop offset="0" stop-color="#7fe0ff"/><stop offset="1" stop-color="#1b5fd1"/></radialGradient>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <radialGradient id="vign" cx="50%" cy="45%" r="75%"><stop offset="60%" stop-color="#000" stop-opacity="0"/><stop offset="100%" stop-color="#1b2a55" stop-opacity="0.16"/></radialGradient>
</defs>

<g id="world"></g>
<rect width="1080" height="1920" fill="url(#vign)" pointer-events="none"/>
</svg>
<script>
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)), sm=x=>{x=cl(x);return x*x*(3-2*x)}, ramp=(t,t0,d)=>sm((t-t0)/d), eo=x=>1-Math.pow(1-cl(x),3), lerp=(a,b,k)=>a+(b-a)*k;
const eback=x=>{x=cl(x);const c=1.9;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
const INK='#14142b', INK2='#7a97d6', RED='#e63946', PINK='#ff9fb8', SKIN='#ffe2cc', ORANGE='#f4a12a', CYAN='#19a7d8', YEL='#ffcf33', BRAINC='#ffc2d1';
function cr(pts,closed=false){let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;const P=closed?[pts[pts.length-1],...pts,pts[0],pts[1]]:[pts[0],...pts,pts[pts.length-1]];
  for(let i=1;i<P.length-2;i++){const[p0,p1,p2,p3]=[P[i-1],P[i],P[i+1],P[i+2]];d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)} ${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)},${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)} ${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)},${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;}return d+(closed?'Z':'');}
function circ(cx,cy,rx,ry=rx,n=18,wob=0,seed=1){const p=[];for(let i=0;i<n;i++){const a=i/n*6.2832;const w=1+wob*Math.sin(a*3+seed)*0.5+wob*Math.sin(a*5+seed*2)*0.3;p.push([cx+rx*w*Math.cos(a),cy+ry*w*Math.sin(a)]);}return cr(p,true);}
let o='';
const S=(d,k=1,col=INK,w=9,ex='')=>{if(k<=0)return;o+=`<path d="${d}" pathLength="1" stroke-dasharray="1 1" stroke-dashoffset="${(1-cl(k)).toFixed(4)}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" ${ex}/>`;};
const Fi=(d,fill,op=1,ex='')=>{if(op<=0.01)return;o+=`<path d="${d}" fill="${fill}" opacity="${op.toFixed(3)}" ${ex}/>`;};
// shape = shadow offset print + fill + outline (draw-on k)
function shape(d,fill,k,col=INK,w=9){Fi(d,'#000',cl(k*2-1)*0.28,'transform="translate(8 14)"');Fi(d,fill,cl(k*2-1));S(d,k,col,w*0.8);}
const Tx=(x,y,s,txt,col=INK,op=1,font='Hand',ex='')=>{if(op<=0.01)return;o+=`<text x="${x}" y="${y}" font-family="${font}" font-size="${s}" fill="${col}" opacity="${op.toFixed(3)}" text-anchor="middle" ${ex}>${txt}</text>`;};
const G=(tr,f)=>{o+=`<g transform="${tr}">`;f();o+='</g>';};

// ---------------- cast + props ----------------
function kid(x,y,s,k,st){ // st: {eyes, mouth, pain, lookx, cone, coneBite, blink}
  G(`translate(${x} ${y}) scale(${s})`,()=>{
    // neck + shirt
    shape('M-120 300 Q0 250 120 300 L210 470 L-210 470Z','#7fb3ff',k);
    shape('M-50 230 L-50 300 Q0 320 50 300 L50 230Z',SKIN,k,INK,8);
    // ears
    shape(circ(-212,20,34,48,10),SKIN,k); shape(circ(212,20,34,48,10),SKIN,k);
    // head
    const hd=circ(0,0,215,245,26,0.03,2); shape(hd,SKIN,k);
    // hair
    shape('M-200 -90 Q-210 -250 -40 -265 Q120 -285 200 -120 Q150 -170 90 -150 Q60 -210 -10 -170 Q-40 -220 -100 -170 Q-150 -190 -200 -90Z','#5a3b2e',k,INK,9);
    // forehead pain (red hatch throb + cracks)
    if(st.pain>0){const pd=circ(0,-120,140,58,16);Fi(pd,'#ffb3b3',st.pain*0.6);Fi(pd,'url(#hRed)',st.pain*(0.6+0.4*Math.sin(st.t*14)));
      S('M-90 -150 l25 22 l-10 20 l28 18 M60 -160 l-20 25 l18 15 l-14 22',st.pain,RED,8);
      for(let i=0;i<3;i++){const a=-2.3+i*0.8;const r1=260,r2=300+18*Math.sin(st.t*16+i);S(`M${r1*Math.cos(a)} ${-60+r1*Math.sin(a)} L${r2*Math.cos(a)} ${-60+r2*Math.sin(a)}`,st.pain,RED,10);}}
    // cheeks
    Fi(circ(-125,85,42,26,10),'#ff9db0',cl(k*2-1)*0.7); Fi(circ(125,85,42,26,10),'#ff9db0',cl(k*2-1)*0.7);
    // brows
    const bu=st.eyes=='wide'?-22:(st.eyes=='squeeze'?10:0);
    S(`M-120 ${-55+bu} q40 ${-22+(st.eyes=='squeeze'?28:0)} 80 0`,k,INK,10); S(`M40 ${-55+bu} q40 ${-22+(st.eyes=='squeeze'?28:0)} 80 0`,k,INK,10);
    // eyes
    for(const ex of [-80,80]){
      if(st.eyes=='squeeze'){S(`M${ex-34} 0 l30 -14 M${ex-34} 0 l30 14`.replace(/l30/g,'l60').replace('M'+(ex-34),'M'+(ex-30)),k,INK,10);}
      else if(st.eyes=='happy'||(st.blink)){S(`M${ex-30} 6 q30 -26 60 0`,k,INK,10);}
      else if(st.eyes=='wink'&&ex>0){S(`M${ex-30} 6 q30 -26 60 0`,k,INK,10);}
      else{const r=st.eyes=='wide'?40:32;shape(circ(ex,0,r,r*1.12,14),'#fff',k,INK,8);if(k>0.6){o+=`<circle cx="${ex+(st.lookx||0)*10}" cy="4" r="${st.eyes=='wide'?13:16}" fill="${INK}"/><circle cx="${ex+(st.lookx||0)*10+5}" cy="-3" r="5" fill="#fff"/>`;}}}
    // nose
    S('M-6 30 q-22 40 10 50',k,INK,8);
    // mouth
    const m=st.mouth;
    if(m=='bite'){shape(circ(0,140,78,62,14),'#7a1f2e',k,INK,9);Fi('M-60 110 H60 V128 H-60Z','#fff',cl(k*2-1));}
    else if(m=='o'){shape(circ(0,150,40,50,12),'#7a1f2e',k,INK,9);}
    else if(m=='pain'){shape('M-70 150 l20 -18 l20 18 l20 -18 l20 18 l20 -18 l20 18 Q0 200 -70 150Z','#7a1f2e',k,INK,8);}
    else if(m=='lick'){shape('M-55 130 Q0 175 55 130 Q0 150 -55 130Z','#7a1f2e',k,INK,8);shape('M-10 150 Q5 205 30 152Z','#ff7d99',k,INK,7);}
    else S('M-60 130 Q0 185 60 130',k,INK,10);
  });}
function cone(x,y,s,k,bites=0,rot=0){G(`translate(${x} ${y}) rotate(${rot}) scale(${s})`,()=>{
  shape('M-95 0 L0 330 L95 0Z','url(#waffle)',k,'#9a5a1c',9);
  let sc;
  if(bites==0) sc=cr([[-108,0],[-122,-70],[-80,-145],[0,-178],[80,-145],[122,-70],[108,0]],true);
  else if(bites==1) sc=cr([[-108,0],[-122,-70],[-84,-140],[-30,-150],[-20,-110],[10,-96],[30,-130],[80,-140],[122,-70],[108,0]],true);
  else sc=cr([[-108,0],[-118,-60],[-70,-96],[-30,-80],[0,-110],[40,-82],[90,-96],[118,-60],[108,0]],true);
  shape(sc,'#ffb3c8',k,'#c22e63',9);
  S('M-70 0 q12 44 26 0 M10 0 q12 58 24 0 M60 0 q8 30 16 0',k,'#c22e63',8);
  for(const [a,b] of [[-40,-80],[30,-60],[-70,-40],[60,-110]]) if(bites==0||b>-90) Fi(`M${a} ${b} l10 4 l-6 8Z`,'#ff5c8a',cl(k*2-1));
});}
function frost(x,y,sz,k,seed=1){if(k<=0)return;for(let i=0;i<6;i++){const a=i*Math.PI/3+seed;const ex=x+Math.cos(a)*sz,ey=y+Math.sin(a)*sz;S(`M${x} ${y} L${ex} ${ey}`,k*1.3,CYAN,7);
  for(const f of [0.45,0.72]){const bx=x+Math.cos(a)*sz*f,by=y+Math.sin(a)*sz*f;for(const sgn of [-1,1]){const aa=a+sgn*0.7;S(`M${bx} ${by} l${Math.cos(aa)*sz*0.32} ${Math.sin(aa)*sz*0.32}`,k*1.6-0.4,CYAN,5);}}}}
function pipe(x,y,len,w,k,face,t,shakeA=0){ // hanging vessel creature (from the ceiling, top at y)
  const jx=shakeA*Math.sin(t*45+x);
  G(`translate(${x+jx} ${y})`,()=>{
    const d=`M${-w/2} 0 C${-w/2} ${len*0.4} ${-w/2-6} ${len*0.7} ${-w/2} ${len} Q0 ${len+w*0.6} ${w/2} ${len} C${w/2+6} ${len*0.7} ${w/2} ${len*0.4} ${w/2} 0Z`;
    shape(d,'#ff6b6b',k,'#8c1625',8);
    if(k>0.6){const fy=len*0.62;
      if(face=='scared'){o+=`<circle cx="${-w*0.18}" cy="${fy}" r="${Math.max(5,w*0.13)}" fill="#fff" stroke="#8c1625" stroke-width="4"/><circle cx="${w*0.18}" cy="${fy}" r="${Math.max(5,w*0.13)}" fill="#fff" stroke="#8c1625" stroke-width="4"/><circle cx="${-w*0.18}" cy="${fy}" r="4" fill="#3a0a10"/><circle cx="${w*0.18}" cy="${fy}" r="4" fill="#3a0a10"/>`;o+=`<ellipse cx="0" cy="${fy+w*0.32}" rx="${w*0.12}" ry="${w*0.15}" fill="#3a0a10"/>`;
        S(`M${w*0.55} ${fy-30} q10 16 0 26`,1,CYAN,5);}
      else if(face=='squish'){S(`M${-w*0.3} ${fy} l${w*0.22} 6 M${w*0.3} ${fy} l${-w*0.22} 6`,1,'#3a0a10',4);S(`M${-w*0.15} ${fy+w*0.4} h${w*0.3}`,1,'#3a0a10',4);}
      else if(face=='gasp'){for(const s of [-1,1])o+=`<circle cx="${s*w*0.2}" cy="${fy}" r="${w*0.12}" fill="#fff" stroke="#8c1625" stroke-width="4"/><circle cx="${s*w*0.2}" cy="${fy}" r="${w*0.05}" fill="#3a0a10"/>`;o+=`<ellipse cx="0" cy="${fy+w*0.3}" rx="${w*0.16}" ry="${w*0.2}" fill="#3a0a10"/>`;}
      else {S(`M${-w*0.3} ${fy} q${w*0.12} -10 ${w*0.24} 0 M${w*0.06} ${fy} q${w*0.12} -10 ${w*0.24} 0`,1,'#3a0a10',4);S(`M${-w*0.18} ${fy+w*0.28} q${w*0.18} 14 ${w*0.36} 0`,1,'#3a0a10',4);}}
  });}
function phone(x,y,s,k,ring,t,hung=true){G(`translate(${x+(ring?6*Math.sin(t*60):0)} ${y}) scale(${s}) rotate(${ring?6*Math.sin(t*30):0})`,()=>{
  shape('M-90 40 Q-90 -10 -50 -10 H50 Q90 -10 90 40 V90 H-90Z','#ff6b6b',k);
  shape('M-30 20 a30 30 0 1 0 60 0 a30 30 0 1 0 -60 0',`#fff`,k,INK,7);
  const ry=hung?0:-60-10*Math.sin(t*20);
  shape(`M-110 ${-30+ry} Q-110 ${-70+ry} -70 ${-70+ry} H70 Q110 ${-70+ry} 110 ${-30+ry} L80 ${-20+ry} Q60 ${-45+ry} 0 ${-45+ry} Q-60 ${-45+ry} -80 ${-20+ry}Z`,'#ff6b6b',k);
  if(ring){for(let i=0;i<3;i++){const r=120+i*30;S(`M${-r} -40 q-16 -40 0 -80 M${r} -40 q16 -40 0 -80`,(Math.sin(t*12-i)+1)/2,RED,6);}}
});}
function brainHQ(x,y,s,k,expr,t){G(`translate(${x} ${y}) scale(${s})`,()=>{
  const b=cr([[-200,40],[-215,-40],[-170,-120],[-80,-165],[20,-175],[120,-150],[195,-90],[215,0],[180,70],[90,100],[-20,105],[-130,95]],true);
  shape(b,BRAINC,k,'#b0306a',10);
  for(const g of ['M-150 -40 q30 -40 70 -10 t70 -10','M-120 30 q40 -30 80 0 t80 -6','M20 -120 q40 -10 50 30','M90 -60 q40 0 50 50','M-60 -130 q10 40 50 40']) S(g,k,'#b0306a',7);
  // face
  if(k>0.6){const ey=-20;
    if(expr=='alarm'){for(const s of [-1,1])o+=`<circle cx="${s*60}" cy="${ey}" r="30" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="${s*60}" cy="${ey}" r="9" fill="${INK}"/>`;o+=`<ellipse cx="0" cy="55" rx="34" ry="28" fill="#7a1f2e" stroke="${INK}" stroke-width="6"/>`;}
    else if(expr=='confused'){o+=`<circle cx="-60" cy="${ey}" r="26" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="-55" cy="${ey+4}" r="9" fill="${INK}"/><circle cx="60" cy="${ey}" r="18" fill="#fff" stroke="${INK}" stroke-width="7"/><circle cx="63" cy="${ey+2}" r="7" fill="${INK}"/>`;S('M-40 60 q20 -14 40 0 t40 0',1,INK,7);}
    else {for(const s of [-1,1])S(`M${s*60-24} ${ey} q24 -22 48 0`,1,INK,8);S('M-40 50 q40 30 80 0',1,INK,8);}}
  // headset
  S('M-170 -60 Q0 -250 170 -60',k,INK,12); shape(circ(-178,-40,26,40,10),'#4a6fd0',k); shape(circ(178,-40,26,40,10),'#4a6fd0',k);
  S('M178 0 Q170 70 90 80',k,INK,8); shape(circ(84,80,14,14,8),'#4a6fd0',k);
});}

window.TL=null; const L=i=>TL.lines[i][0], LE=i=>TL.lines[i][1];
function W(i,w){const q=TL.words.find(q=>q[2]==i&&q[0].toLowerCase().replace(/[^a-z']/g,'').startsWith(w));return q?q[1]:L(i);}
function stamp(txt,x,y,rot,k,col=RED,size=110){if(k<=0)return;const s=lerp(2.2,1,eo(k*1.4));const op=cl(k*3);
  const w=txt.length*size*0.5+60;o+=`<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})" opacity="${op}"><rect x="${-w/2}" y="${-size*0.85}" width="${w}" height="${size*1.25}" fill="#14142b" fill-opacity="0.92" stroke="${col}" stroke-width="10" rx="10"/><rect x="${-w/2+12}" y="${-size*0.85+12}" width="${w-24}" height="${size*1.25-24}" fill="none" stroke="${col}" stroke-width="4" rx="6"/><text x="0" y="${size*0.12}" font-family="Anton" font-size="${size}" fill="${col}" text-anchor="middle" letter-spacing="4">${txt}</text></g>`;}
function note(txt,x,y,k,col=INK,size=54,rot=-3){if(k<=0)return;o+=`<g transform="translate(${x} ${y}) rotate(${rot})" opacity="${cl(k*2)}"><text x="0" y="0" font-family="Hand" font-size="${size}" fill="${col}" text-anchor="middle">${txt}</text></g>`;
  const w=txt.length*size*0.26;S(`M${x-w} ${y+16} q${w} 14 ${2*w} -4`,k*1.5-0.5,col==INK?RED:col,7);}
function arrow(x1,y1,x2,y2,k,col=INK,w=8){S(`M${x1} ${y1} Q${(x1+x2)/2+40} ${(y1+y2)/2-40} ${x2} ${y2}`,k,col,w);if(k>0.95){const a=Math.atan2(y2-y1,x2-x1);o+=`<path d="M${x2} ${y2} l${-30*Math.cos(a-0.5)} ${-30*Math.sin(a-0.5)} M${x2} ${y2} l${-30*Math.cos(a+0.5)} ${-30*Math.sin(a+0.5)}" stroke="${col}" stroke-width="${w}" stroke-linecap="round" fill="none"/>`;}}
function grid(){o+=`<rect x="-200" y="-400" width="1480" height="2720" fill="url(#gmaj)"/>`;}
function sheetTag(n,title,k){if(k<=0)return;o+=`<g opacity="${cl(k*2)}" transform="translate(540 300)"><rect x="-330" y="-46" width="660" height="80" fill="#fff" stroke="${INK}" stroke-width="5"/><line x1="-190" y1="-46" x2="-190" y2="34" stroke="${INK}" stroke-width="4"/><text x="-260" y="12" font-family="Anton" font-size="40" fill="${INK}" text-anchor="middle" letter-spacing="2">${n}</text><text x="70" y="14" font-family="Hand" font-size="44" fill="${INK}" text-anchor="middle">${title}</text></g>`;}

// ===== Kid v2: appealing cartoon character with hands, shading, real expressions =====
const SK='#ffd6b0', SKD='#f0b27f', HAIR='#3a2418', HAIRH='#6e4630', HOOD='#2ec4a6', HOODD='#1f9a83', OUT='#1a1530';
function hand(x,y,s,rot,k,pose='grip'){G(`translate(${x} ${y}) rotate(${rot}) scale(${s})`,()=>{
  if(pose=='grip'){ // fingers wrapped (seen from front)
    shape('M-50 -30 Q-58 30 -20 46 L40 46 Q62 30 56 -20 Q40 -50 0 -48 Q-36 -50 -50 -30Z',SK,k,OUT,8);
    for(const fx of [-28,-6,16,36]) S(`M${fx} -40 q4 30 0 70`,k,SKD,6);
    shape('M-56 -20 Q-86 -30 -82 4 Q-74 22 -46 12Z',SK,k,OUT,8);}
  else { // palm flat (on forehead)
    shape('M-60 -10 Q-70 50 -20 60 L50 54 Q80 40 70 0 L66 -70 Q60 -86 50 -70 L46 -20 L40 -88 Q32 -104 22 -88 L20 -24 L10 -92 Q0 -106 -10 -90 L-8 -20 L-24 -76 Q-34 -90 -42 -74 Z',SK,k,OUT,8);}
});}
function sleeve(x1,y1,x2,y2,k,w=70){const a=Math.atan2(y2-y1,x2-x1),n=[-Math.sin(a),Math.cos(a)];
  const d=`M${x1+n[0]*w/2} ${y1+n[1]*w/2} L${x2+n[0]*w*0.36} ${y2+n[1]*w*0.36} L${x2-n[0]*w*0.36} ${y2-n[1]*w*0.36} L${x1-n[0]*w/2} ${y1-n[1]*w/2}Z`;shape(d,HOOD,k,OUT,8);
  Fi(`M${x2+n[0]*w*0.4} ${y2+n[1]*w*0.4} L${x2-n[0]*w*0.4} ${y2-n[1]*w*0.4}`,'none',1);S(`M${x2+n[0]*w*0.4} ${y2+n[1]*w*0.4} L${x2-n[0]*w*0.4} ${y2-n[1]*w*0.4}`,k,OUT,12);}
function kid2(x,y,s,k,st){ // st: eyes, mouth, pose('cone'|'pain'|'none'|'lick'), pain, t, look
  const t=st.t||0, br=Math.sin(t*3)*4;
  G(`translate(${x} ${y+br}) scale(${s})`,()=>{
    // body / hoodie
    shape('M-230 470 Q-240 330 -150 300 Q0 270 150 300 Q240 330 230 470Z',HOOD,k,OUT,9);
    Fi('M60 300 Q170 310 230 470 L120 470 Q120 360 60 300Z',HOODD,cl(k*2-1));
    S('M-40 300 q-6 60 -14 90 M40 300 q6 60 14 90',k,'#e8fff8',7); o+=`<circle cx="-54" cy="392" r="8" fill="#e8fff8" opacity="${k}"/><circle cx="54" cy="392" r="8" fill="#e8fff8" opacity="${k}"/>`;
