                new THREE.MeshPhysicalMaterial({color:0x2a7fd0,roughness:0.35,metalness:0.1})];
function makeTitle(font){title=new THREE.Group();
  [['BRAIN',0.72],['FREEZE',-0.72]].forEach(([w,y])=>{const g=new TextGeometry(w,{font,size:1.12,depth:0.4,curveSegments:6,bevelEnabled:true,bevelThickness:0.06,bevelSize:0.04,bevelSegments:3});
  g.computeBoundingBox();const bb=g.boundingBox;g.translate(-(bb.max.x+bb.min.x)/2,-(bb.max.y+bb.min.y)/2+y,0); title.add(new THREE.Mesh(g,titleMat));}); title.position.set(0,5.5,-3.4); title.visible=false; S.add(title);}

// ---------- overlay (labels with leader lines + captions) ----------
const OV=document.getElementById('ov'), SV=document.getElementById('lines');
function proj(p){const v=p.clone();HEAD.localToWorld(v);v.project(cam);return [(v.x+1)/2*W,(1-v.y)/2*H];}
let ovHTML='',svgHTML='';
function label(txt,p3,dx,dy,op,size=46,col='#fff'){if(op<=0.01)return;const [x,y]=proj(p3);const lx=cl(x+dx,330,750),ly=cl(y+dy,300,1480);
  svgHTML+=`<line x1="${x}" y1="${y}" x2="${lx}" y2="${ly+ (dy>0?-size*0.55:size*0.55)}" stroke="${col}" stroke-width="4" opacity="${op}"/><circle cx="${x}" cy="${y}" r="9" fill="${col}" opacity="${op}"/>`;
  ovHTML+=`<div class="lab" style="left:${lx}px;top:${ly}px;font-size:${size}px;opacity:${op};color:${col}">${txt}</div>`;}
function caption(html,y,op,size=92,sc=1){if(op<=0.01)return;ovHTML+=`<div class="cap" style="top:${y}px;font-size:${size}px;opacity:${op};transform:translate(-50%,-50%) scale(${sc})">${html}</div>`;}

// ---------- timeline ----------
let TL=null;   // {lines:{id:[s,e]}, words:[[w,t,line]]}
const L=(id)=>TL.lines[id][0], LE=(id)=>TL.lines[id][1];
function WT(id,w){const x=TL.words.find(q=>q[2]==id&&q[0].toLowerCase().replace(/[^a-z']/g,'').startsWith(w));return x?x[1]:L(id);}

function setCam(pos,look,fov=32){cam.position.copy(pos);cam.fov=fov;cam.updateProjectionMatrix();cam.lookAt(look);}
function shake(t,amp){if(amp<=0)return;cam.position.x+=amp*Math.sin(t*61);cam.position.y+=amp*Math.cos(t*53);}

window.renderAt=function(t){
  ovHTML='';svgHTML='';
  // defaults
  let xr=0, lab=0, show_ic=true, warmBg=1;
  const tBite=WT('i2','bite'), tFreeze=WT('i2','freezing'), tA1=L('a1'), tPanic=WT('a1','panic'), tSq=WT('a2','squeeze'), tSnap=WT('a2','snap'), tRush=WT('a2','rushing');
  const tA3=L('a3'), tNerve=WT('a3','trigeminal'), tAlarm=WT('a3','alarm'), tB1=L('b1'), tWrong=WT('b1','wrong'), tFore=WT('b2','forehead'), tB3=L('b3'), tBF=WT('b3','brain'), tDoc=WT('b3','doctors');
  const tC1=L('c1'), tFaster=WT('c1','faster'), tC2=L('c2'), tTongue=WT('c2','tongue'), tWarm=WT('c2','warmth'), tFades=WT('c2','fades'), tC3=L('c3'), tSlow=WT('c3','slower'), END=TL.end;

  // ===== x-ray amount over time =====
  xr = ramp(t,tFreeze-0.15,0.6) * (1-ramp(t,tFore+0.15,0.5)) + ramp(t,tC1+0.6,0.5)*(1-ramp(t,tC3-0.35,0.45));
  if(t>=tB3-0.2 && t<tC1+0.6) xr=0;
  // ===== ice cream =====
  scoop.visible=t<tBite; scoop2.visible=!scoop.visible;
  let icPos, icRot=0;
  if(t<tBite){const k=eo(t/(tBite))*1; icPos=lv(V(1.9,-3.0,5.4),V(0.1,0.05,3.2),k); icRot=lerp(-0.5,-0.85,k);}
  else{const k=ramp(t,tBite,0.35); icPos=lv(V(0.1,0.05,3.2),V(1.9,-2.9,4.6),k); icRot=lerp(-0.85,-0.4,k);}
  if(t>=tC3-0.6){const k=ramp(t,tC3-0.6,1.2); icPos=lv(V(2.2,-3.4,5.4),V(0.25,-0.1,3.4),k); icRot=-0.7; scoop.visible=true; scoop2.visible=false;}
  IC.position.copy(icPos); IC.rotation.set(icRot,0,0.35); IC.scale.setScalar(0.82);
  IC.visible = (t<tA1 || t>=tC3-0.6) && xr<0.6;
  icyPuff.material.opacity=0.5*(IC.visible?1:0); icyPuff.rotation.y=t*0.4; icyPuff.position.y=0.2+((t*0.3)%0.5);

  // chunk travelling into the mouth -> sits on the palate
  const ck=ramp(t,tBite,0.5); chunk.position.copy(lv(V(0,0.45,2.9),V(0,0.82,1.6),ck));
  chunk.material.opacity=cl(xr*1.3)*(t<tSq?1:1-ramp(t,tSq,1.2));
  chunk.material.emissiveIntensity=0.35;

  // ===== head materials =====
  if(skinMesh){skinMat.opacity=1-xr; skinMat.transparent=xr>0.001; skinMat.depthWrite=xr<0.5; skinMesh.visible=xr<0.999; xrayMat.uniforms.op.value=xr*0.85; xrayMesh.visible=xr>0.001;}
  if(window.shirt){shirt.material.opacity=1-xr; shirt.visible=xr<0.98; collar.material.opacity=1-xr; collar.visible=xr<0.98; shirt.material.depthWrite=xr<0.5;}
  const aOp=cl(xr*1.15);
  brainMat.opacity=aOp*0.92; palMat.opacity=aOp*0.85; tongueMat.opacity=aOp*0.9; vesMat.opacity=aOp; nerveMat.opacity=aOp; bpM.opacity=0; frM.opacity=0;
  const titleSec=(t>=tB3-0.2&&t<tC1+0.6)?1:0; labMat.opacity=cl(xr*1.4+0.75*titleSec); dustM.opacity=0.7*xr; sunnyMat.color.setScalar((1-0.85*xr)*0.9);

  // ===== cold, vessels, nerve, pain =====
  const cold = ramp(t,tFreeze-0.1,0.6)*(1-ramp(t,tWarm,1.6));
  frM.opacity=aOp*cold*0.95; coldSpr.material.opacity=aOp*cold*0.55*(0.85+0.15*Math.sin(t*6));
  palMat.emissive.setRGB(0.1*cold,0.35*cold,0.55*cold);
  // vessel radius: normal 1 -> panic jitter -> squeeze 0.35 -> snap 1.8 -> calm 1.2 -> after tongue 1
  let vs=1, jit=0;
  if(t>=tPanic-0.2) jit=0.25*(1-ramp(t,tSq,0.3));
  if(t>=tSq) vs=lerp(1,0.35,ramp(t,tSq,0.35));
  if(t>=tSnap) vs=lerp(0.35,1.9,eo((t-tSnap)/0.25));
  if(t>=tRush+0.8) vs=lerp(1.9,1.35,ramp(t,tRush+0.8,1.0));
  if(t>=tWarm) vs=lerp(1.35,1.0,ramp(t,tWarm,1.2));
  if(xr>0.01) buildVessels(vs,jit,t); else vesMeshes.forEach(m=>m.visible=false);
  vesMat.emissiveIntensity=0.3+ (t>=tSnap && t<tA3+1? 0.9*(1-ramp(t,tSnap+0.2,1.5)):0) - (t>=tSq&&t<tSnap?0.25:0);
  vesMat.color.setRGB(t>=tSq&&t<tSnap?0.45:0.85,0.08,0.12);
  // blood rushing particles
  if(t>=tSnap && t<tA3+1.5 && xr>0.01){const pa=bpG.attributes.position;for(let i=0;i<bpN;i++){const v=vesselPaths[i%vesselPaths.length];const u=((i*0.137+(t-tSnap)*0.8)%1);const p=v.curve.getPoint(u);pa.setXYZ(i,p.x,p.y+0.01,p.z);}pa.needsUpdate=true;
    bpM.opacity=aOp*(1-ramp(t,tA3+0.8,0.7));}
  // nerve glow + pulses (a3 .. b2)
  const nOn=ramp(t,tNerve-0.2,0.4)*(1-ramp(t,tWarm,1.5));
  nerveMat.emissiveIntensity=0.15+2.2*nOn*(0.8+0.2*Math.sin(t*14));
  pulses.forEach((m,i)=>{const u=((t-tA3)*0.75+i/pulses.length)%1;const on=t>tA3-0.1&&t<tFore+0.3;m.position.copy((i%2?nerveC2:nerveC).getPoint(Math.max(0,u)));m.visible=on&&xr>0.05;m.scale.setScalar(0.7+0.5*Math.sin(u*3.14));});
  pulseMat.opacity=aOp*ramp(t,tA3,0.3)*(1-ramp(t,tFore,0.5));
  alarmSpr.material.opacity=aOp*ramp(t,tAlarm-0.05,0.12)*(1-ramp(t,tAlarm+0.25,0.8))*0.9 + aOp*0.25*ramp(t,tB1,0.3)*(1-ramp(t,tFore,0.4));
  brainMat.emissiveIntensity=0.25+1.6*alarmSpr.material.opacity;
  // wrong address arc brain -> forehead
  arcMat.opacity=aOp*ramp(t,tWrong-0.1,0.5)*(1-ramp(t,tFore+0.4,0.6));
  // pain on the forehead (x-ray and skin)
  const pain=ramp(t,tFore-0.25,0.35)*(1-ramp(t,tFades-0.4,1.4));
  painSpr.material.opacity=pain*(0.82+0.18*Math.sin(t*9));
  // tongue rescue
  const tr=ramp(t,tTongue-0.3,0.7);
  tongue.position.y=lerp(0.42,0.80,tr); tongue.scale.y=lerp(0.28,0.24,tr);
  tongueMat.emissiveIntensity=1.1*ramp(t,tWarm-0.3,0.6)*(1-ramp(t,tC3-0.6,0.6));
  warmSpr.material.opacity=aOp*0.8*ramp(t,tWarm-0.3,0.7)*(1-ramp(t,tFades+1.2,1.0));

  // ===== camera per section =====
  let shk=0;
  if(t<tA1){ // hook: warm 3/4 close-up, cone to mouth, bite punch-in, then x-ray reveal from the side-front
    const k=ramp(t,0,tBite); const p=lv(V(6.8,1.6,15.5),V(4.2,1.1,11.0),k); const look=lv(V(0.2,0.9,1.4),V(0.1,0.7,1.8),k);
    let fov=32 - 4*ramp(t,tBite-0.05,0.18)*(1-ramp(t,tBite+0.3,0.6));
    if(t>tFreeze-0.3){const k2=ramp(t,tFreeze-0.3,1.0); p.lerp(V(6.5,1.6,6.2),k2); look.lerp(V(0,1.2,1.2),k2);}
    setCam(p,look,fov); if(t>=tBite&&t<tBite+0.35) shk=0.06*(1-(t-tBite)/0.35);
    if(t>=tFreeze&&t<tFreeze+0.5) shk=0.05*(1-(t-tFreeze)/0.5);
  } else if(t<tA3){ // palate close-up from below-front
    const k=ramp(t,tA1,LE('a2')-tA1); setCam(lv(V(3.6,-0.2,5.6),V(2.6,0.1,4.6),k),V(0,0.95,1.35),30);
    if(t>=tSnap&&t<tSnap+0.4) shk=0.05*(1-(t-tSnap)/0.4);
  } else if(t<tB1){ // side view: nerve to brain
    const k=ramp(t,tA3,LE('a3')-tA3); setCam(lv(V(9.5,2.3,6.0),V(8.4,2.6,4.2),k),lv(V(0,1.7,0.6),V(0,1.9,0.5),k),34);
    if(t>=tAlarm&&t<tAlarm+0.45) shk=0.09*(1-(t-tAlarm)/0.45);
  } else if(t<tB3-0.2){ // front 3/4: brain -> forehead
    const k=ramp(t,tB1,tB3-tB1); setCam(lv(V(-8.5,3.0,12.5),V(-4.8,3.0,12.6),k),lv(V(0,2.2,0.8),V(0,2.4,1.2),k),32);
    if(t>=tFore&&t<tFore+0.5) shk=0.08*(1-(t-tFore)/0.5);
  } else if(t<tC1+0.6){ // TITLE / cover: skin face, frosty pain on the forehead, 3D title behind
    const k=ramp(t,tB3-0.2,tC1+0.6-tB3); setCam(lv(V(-0.8,3.0,19.5),V(-0.5,3.0,17.6),k),V(0,3.15,0.6),34);
    if(t>=tBF&&t<tBF+0.4) shk=0.05*(1-(t-tBF)/0.4);
  } else if(t<tC3-0.35){ // tongue rescue: side x-ray close
    const k=ramp(t,tC1+0.6,tC3-tC1); setCam(lv(V(7.4,1.4,5.4),V(6.2,1.3,4.6),k),lv(V(0,1.1,1.2),V(0,1.2,1.2),k),32);
  } else { // back to the face, calm, cone returns
    const k=ramp(t,tC3-0.35,END-tC3); setCam(lv(V(6.0,1.5,14.0),V(4.8,1.2,12.0),k),V(0.2,0.9,1.5),32);
  }
  shake(t,shk);
  // 3D title
  if(title){title.visible = t>=tBF-0.15 && t<tC1+0.6; const k=eo((t-tBF+0.15)/0.45); title.scale.setScalar(0.6+0.4*k); title.position.y=5.75+0.05*Math.sin(t*2);
    title.rotation.y=0; titleMat[0].emissiveIntensity=0.25+0.15*Math.sin(t*3);}
  // pain glow is shown on the skin in the title section (frost blue + red throb)
  coldSpr.material.depthTest=xr>0.01;

  // ===== labels / captions (key moments only) =====
  if(xr>0.3){
    label('ROOF OF YOUR MOUTH',palateC.clone().add(V(0.5,0.25,0.3)),-40,-330,ramp(t,tFreeze+0.2,0.3)*(1-ramp(t,tA1+0.2,0.3)),50);
    label('BLOOD VESSELS',V(0.35,1.15,1.2),-20,-360,ramp(t,tA1+0.3,0.3)*(1-ramp(t,tSq-0.3,0.2)),54,'#ffb0a8');
    label('TRIGEMINAL NERVE',nerveC.getPoint(0.45),-60,-380,ramp(t,tNerve-0.1,0.3)*(1-ramp(t,LE('a3'),0.3)),54,'#ffe27a');
    label('BRAIN',V(0.4,3.4,0.2),120,-260,ramp(t,tAlarm,0.3)*(1-ramp(t,tB1+0.1,0.3)),54,'#ffc4cf');
  }
  if(t>=tSq&&t<tSnap) caption('<b>SQUEEZE</b>',380,ramp(t,tSq,0.12),120,1+0.1*(1-ramp(t,tSq,0.2)));
  if(t>=tSnap&&t<tA3) caption('<i>WIDE OPEN!</i>',380,ramp(t,tSnap,0.1)*(1-ramp(t,tA3-0.2,0.2)),120,1+0.2*(1-ramp(t,tSnap,0.2)));
  if(t>=tWrong-0.2&&t<tB3-0.2) caption('WRONG <i>ADDRESS</i>',360,ramp(t,tWrong-0.2,0.2)*(1-ramp(t,tFore+0.3,0.3)),104);
  if(t>=tFore-0.1&&t<tB3-0.2) caption('<i>FOREHEAD?!</i>',360,ramp(t,tFore+0.3,0.2),118);
  if(t>=tDoc-0.1&&t<tC1+0.6) caption('a <b>"cold-stimulus headache"</b>',1440,ramp(t,tDoc-0.1,0.3),58);
  if(t>=tTongue-0.2&&t<tC3-0.35) caption('TONGUE = <i style="color:#ffae5a">HEATER</i>',380,ramp(t,tTongue-0.2,0.25),104);
  if(t>=tSlow-0.4) caption('just eat <b>slower.</b>',1400,ramp(t,tSlow-0.4,0.3),84);
  if(t<0.9) caption('',0,0);
  OV.innerHTML=ovHTML; SV.innerHTML=svgHTML;
  // background mood
  sunnyMat.opacity=1;
  comp.render();
};

// ---------- load ----------
const map=tl.load('models/Map-COL.jpg'); map.colorSpace=THREE.SRGBColorSpace;
const nm=tl.load('models/Infinite-Level_02_Tangent_SmoothUV.jpg');
const spec=tl.load('models/Map-SPEC.jpg');
let n=0; const done=()=>{if(++n==2) window.ready=true;};
new GLTFLoader().load('models/LeePerrySmith.glb',g=>{
  const m=g.scene.children[0];
  skinMat=new THREE.MeshPhysicalMaterial({map,normalMap:nm,normalScale:new THREE.Vector2(0.8,0.8),roughness:0.62,roughnessMap:spec});
  skinMesh=m; m.material=skinMat; m.castShadow=true; m.receiveShadow=true; HEAD.add(m);
  xrayMesh=new THREE.Mesh(m.geometry,xrayMat); HEAD.add(xrayMesh);
  HEAD.scale.setScalar(1.0); done();});
new TTFLoader().load('models/anton.woff',json=>{makeTitle(new Font(json));done();},undefined,()=>{done();});
window.setTL=(x)=>{TL=x;};
</script></body></html>
